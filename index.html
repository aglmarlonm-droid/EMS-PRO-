<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dataX · Digital Equipment Accountability System</title><meta name="theme-color" content="#12181f">
<style>
:root{--bg:#12181f;--p:#1b242e;--p2:#243140;--t:#eef2f5;--m:#8fa0b0;--a:#c4cad2;--AVAILABLE:#2bd67b;--OUT:#4da3ff;--OVERDUE:#ff4d4d;--MAINTENANCE:#c084fc;--LOST:#ff8a3d;--INACTIVE:#7a8794}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 Bahnschrift,"Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--p);border-bottom:3px solid var(--a);position:sticky;top:0;z-index:5}
.logo{width:18px;height:18px;background:var(--a);border-radius:4px}h1{font-size:17px;letter-spacing:.06em;margin:0;flex:1}h2{margin:.2em 0 .6em;font-size:22px}
main{max-width:720px;margin:auto;padding:14px 14px 100px}
#off{background:var(--OVERDUE);color:#fff;text-align:center;padding:8px;font-weight:700}
.lnk{background:none;border:0;color:var(--a);font:inherit;min-height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--p);border-radius:14px;padding:14px;border-left:6px solid var(--c)}.stat b{display:block;font-size:34px;line-height:1}.stat span{color:var(--m);font-size:13px}
.card{background:var(--p);border-radius:14px;padding:14px;margin-bottom:10px;border-left:6px solid var(--INACTIVE);display:flex;gap:10px;justify-content:space-between;align-items:center}
.card.AVAILABLE{border-color:var(--AVAILABLE)}.card.ISSUED{border-color:var(--OUT)}.card.OVERDUE{border-color:var(--OVERDUE)}.card.MAINTENANCE{border-color:var(--MAINTENANCE)}.card.LOST{border-color:var(--LOST)}
.panel{background:var(--p);border-radius:14px;padding:14px;margin-bottom:12px;display:block}
.m{color:var(--m);font-size:14px}.warn{color:#ff8080;font-weight:700;margin:6px 0}
.b{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--INACTIVE);color:#0b0f14;margin-left:6px}
.b.AVAILABLE{background:var(--AVAILABLE)}.b.ISSUED{background:var(--OUT)}.b.OVERDUE{background:var(--OVERDUE);color:#fff}.b.MAINTENANCE{background:var(--MAINTENANCE)}.b.LOST{background:var(--LOST)}
.btn{display:block;width:100%;min-height:56px;margin:8px 0;border:0;border-radius:12px;background:var(--a);color:#12181f;font:700 17px inherit;font-family:inherit;letter-spacing:.04em}
.btn.ghost{background:var(--p2);color:var(--t)}.btn.big{min-height:120px;font-size:22px}.btn:disabled{opacity:.4}.btn.sm{width:auto;min-height:44px;padding:0 14px;margin:0;font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select,textarea{width:100%;min-height:48px;margin:4px 0 10px;padding:10px 12px;border-radius:10px;border:1px solid #33465a;background:#0f151b;color:var(--t);font:inherit}
label{font-size:13px;color:var(--m)}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;min-height:48px;border:0;border-radius:10px;background:var(--p2);color:var(--t);font:inherit}.tabs .on{background:var(--a);color:#12181f;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}.kv dt{color:var(--m)}.kv dd{margin:0;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--p);border-top:1px solid #33465a;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--m);font:12px inherit;font-family:inherit}nav button b{display:block;font-size:20px}nav .on{color:var(--a)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#12181f;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:9;max-width:90%}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

.b.GOOD{background:var(--AVAILABLE)}.b.FAIR{background:var(--a)}.b.DAMAGED,.b.FAULTY{background:var(--OVERDUE);color:#fff}.b.ADMIN{background:var(--a)}.b.CONTROLLER{background:var(--OUT)}
.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--m)}.cat{background:var(--p);border-radius:14px;padding:12px 14px;margin-bottom:10px}.ch{display:flex;justify-content:space-between;align-items:baseline}.ch span{color:var(--m);font-size:13px}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cs div{background:var(--p2);border-radius:10px;padding:8px;border-top:3px solid var(--c);font-size:12px;color:var(--m)}.cs b{display:block;font-size:24px;color:var(--t)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px;padding-bottom:6px;border-bottom:2px solid var(--a);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.grp span{color:var(--m);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--t);font-size:16px}.chk input{width:22px;height:22px;min-height:0;margin:0}

.card.DAMAGED{border-color:var(--LOST)}.card.RETIRED{border-color:var(--INACTIVE)}.card.ACTIVE{border-color:var(--AVAILABLE)}.card.TRIAL{border-color:var(--OUT)}.card.SUSPENDED{border-color:var(--OVERDUE)}.card.EXPIRED{border-color:var(--INACTIVE)}.card.RETURNED{border-color:var(--AVAILABLE)}
.b.RETIRED,.b.EXPIRED{background:var(--INACTIVE)}.b.ACTIVE{background:var(--AVAILABLE)}.b.TRIAL{background:var(--OUT)}.b.SUSPENDED{background:var(--OVERDUE);color:#fff}.b.RETURNED{background:var(--AVAILABLE)}.b.DAMAGED{background:var(--LOST);color:#12181f}
.b.CUSTOMER_ADMIN,.b.CONTROLLER,.b.VIEWER,.b.DATAX_ADMIN{background:var(--p2);color:var(--t);border:1px solid #4a5a6b}
h1 small{display:block;font-size:10px;letter-spacing:.1em;color:var(--m);font-weight:400}.chip{font-size:12px;color:var(--a);border:1px solid var(--a);padding:2px 10px;border-radius:99px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button{font-size:14px;padding:0 4px}
</style></head>
<body>
<div id="off" hidden>OFFLINE: connectivity is required to sign equipment out or in</div>
<header><span class="logo"></span><h1>dataX<small>Digital Equipment Accountability System</small></h1><span id="cust" class="chip" hidden></span><button id="out" class="lnk" hidden>Log out</button></header>
<main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBF4_foqVrVt5VQMINPZ2uO77W-Ks89MqA",
  authDomain: "ems-pro-b9491.firebaseapp.com",
  projectId: "ems-pro-b9491",
  storageBucket: "ems-pro-b9491.firebasestorage.app",
  messagingSenderId: "1036651703540",
  appId: "1:1036651703540:web:209a4e22a2941f4413c2a1"
};
const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = getFirestore(fbApp);

// ---------- inline PWA manifest ----------
(() => {
  const svg = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#12181f"/><rect x="120" y="120" width="272" height="272" rx="40" fill="#c4cad2"/><rect x="226" y="205" width="60" height="100" fill="#12181f"/></svg>');
  const m = { name: "dataX Equipment Accountability", short_name: "dataX", start_url: location.href.split('#')[0], display: "standalone", background_color: "#12181f", theme_color: "#12181f", icons: [{ src: svg, sizes: "any", type: "image/svg+xml", purpose: "any maskable" }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
})();


// ---------- NFC ----------
const nfcSupported = 'NDEFReader' in window;
async function scanNfc(onTag, signal) {
  const r = new NDEFReader(); await r.scan({ signal });
  r.onreadingerror = () => onTag(null);
  r.onreading = ev => { let text = null; for (const x of ev.message.records) if (x.recordType === 'text' || x.recordType === 'url') { text = new TextDecoder(x.encoding || 'utf-8').decode(x.data); break; } onTag({ uid: (ev.serialNumber || '').toUpperCase(), text }); };
}


// ---------- helpers ----------
const $ = s => document.querySelector(s), A = $('#app');
const TZ = 'Africa/Johannesburg', CATS = ['Handheld Radio', 'Scanner', 'Tablet', 'Extension Cable', 'Generator', 'Tool', 'Safety Equipment', 'Charger', 'Battery', 'Testing Equipment', 'Other'];
const PRESET = { 'Handheld Radio': 12, 'Scanner': 12, 'Tablet': 12, 'Extension Cable': 24, 'Generator': 48 }, CONDS = ['GOOD', 'FAIR', 'DAMAGED'];
const PLANS = { TRIAL: [5, 25], STANDARD: [50, 500], PROFESSIONAL: [200, 2000], ENTERPRISE: [1000, 10000] };
const S = { user: null, cid: null, cust: null, sub: {}, view: 'home', eq: [], emp: [], loc: [], users: [], tx: null, recent: [], sel: null, pend: null, scanning: false, tab: 'eq', edit: null, q: '', hq: '', xo: false, plat: null, cf: null, af: null, err: '', blocked: false, un: [] };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => t?.toDate ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(t.toDate()) : '—';
const dur = ms => { const m = Math.floor(Math.max(0, ms) / 6e4); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
const tms = e => e.issuedAt?.toMillis?.() ?? Date.now();
const hrs = e => e.dueHours > 0 ? e.dueHours : e.expectedHours;
const over = e => e.status === 'ISSUED' && hrs(e) > 0 && Date.now() - tms(e) > hrs(e) * 36e5;
const st = e => over(e) ? 'OVERDUE' : e.status;
const badge = s => `<span class="b ${s}">${String(s).replace('_', ' ')}</span>`;
const val = id => (document.getElementById(id)?.value ?? '').trim();
const opt = (l, v) => l.map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('');
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4500); };
const need = () => navigator.onLine || (toast('OFFLINE: connectivity is required for this action.'), false);
const col = n => collection(db, 'customers', S.cid, n), dref = (n, id) => doc(db, 'customers', S.cid, n, id);
const R = () => S.user?.role, isPlat = () => R() === 'DATAX_ADMIN', isCA = () => R() === 'CUSTOMER_ADMIN', staff = () => ['CUSTOMER_ADMIN', 'CONTROLLER'].includes(R());
const audit = (action, x = {}) => addDoc(col('auditLogs'), { customerId: S.cid, userId: S.user.uid, userName: S.user.name, action, equipmentId: x.equipmentId || null, employeeId: x.employeeId || null, details: x.details || null, previous: x.previous || null, new: x.new || null, timestamp: serverTimestamp() }).catch(console.error);
const log = audit, plog = (action, cid, details) => addDoc(collection(db, 'auditLogs'), { customerId: cid, userId: S.user.uid, userName: S.user.name, action, details: details || null, timestamp: serverTimestamp() }).catch(console.error);
const pick = o => o ? { name: o.name ?? null, category: o.category ?? null, status: o.status ?? null, nfcId: o.nfcId ?? null, locationName: o.locationName ?? null } : null;
const nextId = (l, p) => p + String(1 + Math.max(0, ...l.map(x => +String(x.id).replace(/\D/g, '') || 0))).padStart(3, '0');
const sorted = (a, k) => [...a].sort((x, y) => String(x[k]).localeCompare(String(y[k])));

const card = (e, act = 'open') => { const s = st(e);
  return `<div class="card ${s}" data-act="${act}" data-id="${esc(e.id)}"><div><b>${esc(e.equipmentId)}</b>${badge(s)}${badge(e.condition || 'GOOD')}<div class="m">${esc(e.name)} · ${esc(e.category)}${e.locationName ? ' · ' + esc(e.locationName) : ''}</div>
  ${e.status === 'ISSUED' ? `<div class="m">Issued to <b>${esc(e.issuedToName)}</b> · ${fmt(e.issuedAt)} · ${dur(Date.now() - tms(e))}</div>` : ''}
  ${s === 'OVERDUE' ? `<div class="warn">⚠ OVERDUE by ${dur(Date.now() - tms(e) - hrs(e) * 36e5)} (allowed ${hrs(e)}h)</div>` : ''}
  ${e.conditionNote && e.condition !== 'GOOD' ? `<div class="m">Note: ${esc(e.conditionNote)}</div>` : ''}</div></div>`; };
const rank = e => { const s = st(e); return s === 'OVERDUE' ? 0 : s === 'ISSUED' ? 1 : 2; };
const catCards = a => { const cs = [...new Set(a.map(e => e.category || 'Other'))].sort(); if (!cs.length) return '';
  return '<div class="sec">BY CATEGORY</div>' + cs.map(c => { const l = a.filter(e => (e.category || 'Other') === c), k = x => l.filter(e => st(e) === x).length;
    return `<div class="cat"><div class="ch"><b>${esc(c)}</b><span>${l.length} total</span></div><div class="cs"><div style="--c:var(--AVAILABLE)"><b>${k('AVAILABLE')}</b>Available</div><div style="--c:var(--OUT)"><b>${l.filter(e => e.status === 'ISSUED').length}</b>Issued</div><div style="--c:var(--OVERDUE)"><b>${k('OVERDUE')}</b>Overdue</div></div></div>`; }).join('') + '<div class="sec">ALL EQUIPMENT</div>'; };
const lst = () => { const l = S.eq.filter(e => !S.q || [e.equipmentId, e.name, e.serialNumber, e.nfcId, e.issuedToName, e.category].some(v => String(v ?? '').toLowerCase().includes(S.q.toLowerCase()))); if (!l.length) return '<p class="m">No equipment found.</p>';
  const g = {}; l.forEach(e => (g[e.category || 'Other'] ||= []).push(e)); return Object.keys(g).sort().map(c => `<div class="grp">${esc(c)}<span>${g[c].filter(e => e.status === 'ISSUED').length} issued / ${g[c].length}</span></div>` + g[c].sort((a, b) => rank(a) - rank(b)).map(e => card(e)).join('')).join(''); };
const recentHTML = () => S.recent.length ? '<div class="sec">RECENT TRANSACTIONS</div>' + S.recent.map(t => `<div class="m" style="padding:7px 2px;border-bottom:1px solid #243140"><b style="color:var(--t)">${esc(t.equipmentId)}</b> ${t.status === 'ISSUED' ? 'issued to' : 'returned by'} ${esc(t.employeeName)} · ${fmt(t.status === 'ISSUED' ? t.issuedAt : t.returnedAt)}</div>`).join('') : '';

// ---------- views ----------
const V = {
  login: () => `<h2>Sign in</h2>${S.err ? `<p class="warn">${esc(S.err)}</p>` : ''}<div class="panel"><label>Email</label><input id="em" type="email" autocomplete="username" autocapitalize="none"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" data-act="login">LOGIN</button><button class="btn ghost" data-act="reset">FORGOT PASSWORD</button></div>`,
  blocked: () => `<h2>Access suspended</h2><div class="panel"><p>The <b>${esc(S.cust?.name || 'organisation')}</b> account is <b>${esc(S.cust?.status || 'unavailable')}</b>. Your data is safe. Please contact dataX to restore access.</p></div>`,
  home() { const a = S.eq.filter(e => e.status !== 'RETIRED'), k = x => a.filter(e => st(e) === x).length, stat = (n, l, c) => `<div class="stat" style="--c:var(--${c})"><b>${n}</b><span>${l}</span></div>`;
    return `<div class="grid">${stat(a.length, 'TOTAL EQUIPMENT', 'a')}${stat(k('AVAILABLE'), 'AVAILABLE', 'AVAILABLE')}${stat(a.filter(e => e.status === 'ISSUED').length, 'ISSUED', 'OUT')}${stat(k('OVERDUE'), 'OUTSTANDING', 'OVERDUE')}${stat(k('MAINTENANCE'), 'MAINTENANCE', 'MAINTENANCE')}${stat(k('DAMAGED'), 'DAMAGED', 'LOST')}${stat(k('LOST'), 'LOST', 'LOST')}</div>
    ${staff() ? '<button class="btn big" data-act="go" data-v="scan">SCAN EQUIPMENT</button>' : ''}${recentHTML()}${catCards(a)}<input id="sq" type="search" placeholder="Search ID, name, serial, person" value="${esc(S.q)}"><div id="lst">${lst()}</div>`; },
  scan: () => `<h2>SCAN EQUIPMENT</h2><p class="m">Hold your phone near the equipment NFC tag.</p>${nfcSupported ? '' : '<p class="warn">NFC scanning is not supported on this device/browser.</p>'}
    <button class="btn big" data-act="nfc" ${nfcSupported ? '' : 'disabled'}>${S.scanning ? 'WAITING FOR TAG…' : 'SCAN NFC'}</button>
    <div class="panel"><label>ENTER EQUIPMENT ID</label><input id="eid" placeholder="RAD-00125" autocapitalize="characters"><button class="btn ghost" data-act="find">FIND EQUIPMENT</button></div>`,
  item() { const e = S.eq.find(x => x.id === S.sel); if (!e) return V.home(); const s = st(e), p = S.pend; let a = '';
    if (staff()) {
      if (e.status === 'AVAILABLE') a = p ? `<div class="panel"><dl class="kv"><dt>EQUIPMENT</dt><dd>${esc(e.name)}</dd><dt>EMPLOYEE</dt><dd>${esc(p.name)}</dd><dt>LOCATION</dt><dd>${esc(e.locationName || '—')}</dd><dt>CONDITION OUT</dt><dd>${p.cond}</dd><dt>ACTION</dt><dd>SIGN OUT</dd><dt>DUE BACK AFTER</dt><dd>${p.hrs}h</dd><dt>TIME</dt><dd>Set by server</dd></dl></div><div class="row"><button class="btn ghost" data-act="cancel">CANCEL</button><button class="btn" data-act="doSign">CONFIRM SIGN OUT</button></div>`
        : `<div class="panel"><label>EMPLOYEE (select or type)</label><input id="pname" list="emps" placeholder="Employee name" autocomplete="off"><datalist id="emps">${S.emp.filter(x => x.active).map(x => `<option value="${esc(x.name)}">`).join('')}</datalist>
        <label>HOURS OUT (due back after)</label><input id="phrs" type="number" inputmode="decimal" min="0.5" step="0.5" value="${e.expectedHours || ''}" placeholder="e.g. 8"><label>CONDITION OUT</label><select id="cout">${opt(CONDS, e.condition || 'GOOD')}</select><button class="btn" data-act="review">SIGN OUT</button></div>`;
      else if (e.status === 'ISSUED') a = p ? `<div class="panel"><dl class="kv"><dt>EQUIPMENT</dt><dd>${esc(e.name)}</dd><dt>FROM</dt><dd>${esc(e.issuedToName)}</dd><dt>CONDITION IN</dt><dd>${p.cond}</dd>${p.note ? `<dt>NOTE</dt><dd>${esc(p.note)}</dd>` : ''}</dl></div><div class="row"><button class="btn ghost" data-act="cancel">CANCEL</button><button class="btn" data-act="doReturn">CONFIRM RETURN</button></div>`
        : `<div class="panel"><label>CONDITION IN</label><select id="cond">${CONDS.map(c => `<option>${c}</option>`).join('')}</select><label>NOTE (optional)</label><input id="cnote" placeholder="e.g. cracked screen"><button class="btn" data-act="askReturn">RETURN EQUIPMENT</button></div>`;
      else a = `<p class="warn">${s} equipment cannot be signed out.</p>`;
    }
    return `<h2>${esc(e.equipmentId)} ${badge(s)}</h2><div class="panel"><dl class="kv"><dt>Name</dt><dd>${esc(e.name)}</dd><dt>Category</dt><dd>${esc(e.category)}</dd><dt>Location</dt><dd>${esc(e.locationName || '—')}</dd><dt>Condition</dt><dd>${badge(e.condition || 'GOOD')} ${esc(e.conditionNote)}</dd>
    ${e.status === 'ISSUED' ? `<dt>Issued to</dt><dd>${esc(e.issuedToName)}</dd><dt>Issued</dt><dd>${fmt(e.issuedAt)}</dd><dt>Duration</dt><dd>${dur(Date.now() - tms(e))}</dd>` : ''}
    ${s === 'OVERDUE' ? `<dt>Overdue</dt><dd class="warn">⚠ ${dur(Date.now() - tms(e) - hrs(e) * 36e5)}</dd>` : ''}</dl></div>${a}`; },
  history() { if (!S.tx) { loadTx(); return '<p class="m">Loading…</p>'; }
    return `<h2>History</h2><input id="hq" type="search" placeholder="Equipment, category or employee" value="${esc(S.hq)}">${staff() ? (S.xo ? xpanel() : '<button class="btn" data-act="xlsxPanel">EXPORT TO EXCEL</button>') : ''}<div id="txl">${txHTML()}</div>`; },
  admin() { if (!isCA()) return V.home(); const T = { eq: ['Equipment', adminEq], emp: ['Employees', adminEmp], loc: ['Locations', adminLoc], usr: ['Users', adminUsr] };
    return `<div class="tabs">${Object.entries(T).map(([k, [l]]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>${T[S.tab][1]()}`; },
  platform() { if (!S.plat) { loadPlat(); return '<p class="m">Loading platform…</p>'; } const c = S.plat, sum = k => c.reduce((s, x) => s + (x[k] || 0), 0), n = s => c.filter(x => x.status === s).length, stat = (v, l, k) => `<div class="stat" style="--c:var(--${k})"><b>${v}</b><span>${l}</span></div>`;
    return `<h2>Platform overview</h2><div class="grid">${stat(c.length, 'CUSTOMERS', 'a')}${stat(n('ACTIVE') + n('TRIAL'), 'ACTIVE / TRIAL', 'AVAILABLE')}${stat(n('SUSPENDED') + n('EXPIRED'), 'SUSPENDED / EXPIRED', 'OVERDUE')}${stat(sum('users'), 'USERS', 'a')}${stat(sum('equip'), 'EQUIPMENT', 'a')}${stat(sum('issued'), 'ISSUED NOW', 'OUT')}${stat(sum('month'), 'TRANSACTIONS THIS MONTH', 'a')}</div>
    <button class="btn" data-act="newCust">CREATE CUSTOMER</button>${S.cf ? custForm() : ''}${S.af ? admForm() : ''}<div class="sec">CUSTOMERS</div>${c.map(custCard).join('') || '<p class="m">No customers yet.</p>'}`; }
};

    await setDoc(doc(db, 'customers', c.customerId), { status: ns, updatedAt: serverTimestamp() }, { merge: true }); await setDoc(doc(db, 'subscriptions', c.customerId), { status: ns }, { merge: true }); plog(ns === 'SUSPENDED' ? 'CUSTOMER_SUSPENDED' : 'CUSTOMER_ACTIVATED', c.customerId, c.name); S.plat = null; render(); }),
  saveAdm: () => run(async () => { const c = S.plat.find(x => x.customerId === S.af); await createUser(S.af, 'CUSTOMER_ADMIN', val('ad_name'), val('ad_email'), $('#ad_pw').value.trim(), c.users, c.sub.userLimit); plog('CUSTOMER_ADMIN_CREATED', S.af, val('ad_email')); S.af = null; S.plat = null; toast('Customer Admin created'); render(); })
};
// ---------- Excel export (ExcelJS loaded on demand) ----------
const xpanel = () => { const cs = [...new Set([...S.eq.map(e => e.category), ...(S.tx || []).map(t => t.category)].filter(Boolean))].sort();
  return `<div class="panel"><h3 style="margin:0 0 8px">Export to Excel</h3><div class="row"><div><label>From date</label><input type="date" id="x_from"></div><div><label>To date</label><input type="date" id="x_to"></div></div>
  <label>Categories to include</label>${cs.map(c => `<label class="chk"><input type="checkbox" class="xc" value="${esc(c)}" checked> ${esc(c)}</label>`).join('')}<p class="m">Leave the dates blank to include all dates.</p>
  <div class="row"><button class="btn ghost" data-act="xlsxPanel">CANCEL</button><button class="btn" data-act="xlsx">DOWNLOAD EXCEL</button></div></div>`; };
const fmtFull = t => t?.toDate ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(t.toDate()).replace(',', '') : '';
const loadXL = () => window.ExcelJS ? Promise.resolve() : new Promise((ok, no) => { const x = document.createElement('script'); x.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; x.onload = ok; x.onerror = () => no(Error('Could not load Excel library. Check your internet.')); document.head.appendChild(x); });
acts.xlsx = async () => { if (!need()) return; toast('Preparing Excel file…');
  try { await loadXL();
    const q = S.hq.toLowerCase(), snap = await getDocs(query(col('equipmentTransactions'), orderBy('createdAt', 'desc'), limit(5000)));
    const fV = val('x_from'), tV = val('x_to'), allC = document.querySelectorAll('.xc'), cats = [...document.querySelectorAll('.xc:checked')].map(c => c.value);
    if (!cats.length) return toast('Select at least one category');
    const f0 = fV ? Date.parse(fV + 'T00:00:00+02:00') : 0, t0 = tV ? Date.parse(tV + 'T23:59:59+02:00') : 1e15;
    const period = (fV || tV ? ` · ${fV || 'start'} to ${tV || 'today'}` : '') + (cats.length < allC.length ? ` · ${cats.join(', ')}` : '');
    const rows = snap.docs.map(d => d.data()).filter(t => { const c = t.createdAt?.toMillis?.() ?? Date.now(); return c >= f0 && c <= t0 && cats.includes(t.category || 'Other') && (!q || `${t.equipmentId} ${t.equipmentName} ${t.employeeName}`.toLowerCase().includes(q)); });
    if (!rows.length) return toast('No records match these options');
    const wb = new ExcelJS.Workbook(); wb.creator = 'Equipment Management'; wb.created = new Date();
    const DARK = 'FF12181F', HEAD = 'FF243140', SILVER = 'FFC4CAD2', thin = { style: 'thin', color: { argb: 'FFD0D5DB' } }, bd = { top: thin, left: thin, bottom: thin, right: thin };
    const fill = c => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: c } });
    const stamp = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, dateStyle: 'medium', timeStyle: 'short', hourCycle: 'h23' }).format(new Date());
    const banner = (ws, n, title, sub) => { ws.mergeCells(1, 1, 1, n); const a = ws.getCell(1, 1); a.value = title; a.font = { name: 'Calibri', size: 18, bold: true, color: { argb: SILVER } }; a.fill = fill(DARK); a.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 }; ws.getRow(1).height = 36;
      ws.mergeCells(2, 1, 2, n); const b = ws.getCell(2, 1); b.value = sub; b.font = { name: 'Calibri', size: 10, italic: true, color: { argb: 'FF5B6773' } }; b.alignment = { indent: 1 }; ws.getRow(2).height = 20; };
    const head = (ws, r, labels) => { const row = ws.getRow(r); labels.forEach((l, i) => { const c = row.getCell(i + 1); c.value = l; c.font = { name: 'Calibri', bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = fill(HEAD); c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; c.border = bd; }); row.height = 26; };
    const COND = { GOOD: ['FFDFF5E8', 'FF1B7F4B'], FAIR: ['FFECEFF3', 'FF4A5560'], DAMAGED: ['FFFBE0E0', 'FFB42318'], FAULTY: ['FFFBE0E0', 'FFB42318'] };
    // Sheet 1: history
    const addHist = (sname, rows) => { const ws = wb.addWorksheet(sname, { views: [{ state: 'frozen', ySplit: 4 }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
    const H = ['#', 'Equipment ID', 'Equipment Name', 'Category', 'Person', 'Signed Out', 'Returned', 'Duration', 'Expected (h)', 'Condition Out', 'Condition In', 'Condition Note', 'Signed Out By', 'Returned By', 'Status'], W = [6, 16, 28, 18, 24, 18, 18, 12, 13, 14, 14, 30, 16, 16, 12];
    W.forEach((w, i) => ws.getColumn(i + 1).width = w);
    banner(ws, H.length, 'EQUIPMENT HISTORY REPORT', `Generated ${stamp} (SAST) by ${S.user.name} · ${rows.length} record${rows.length === 1 ? '' : 's'}${period}${q ? ` · search: "${S.hq}"` : ''}`);
    ws.getRow(3).height = 8; head(ws, 4, H);
    rows.forEach((t, i) => { const mins = t.returnedAt?.toMillis && t.issuedAt?.toMillis ? t.returnedAt.toMillis() - t.issuedAt.toMillis() : null;
      const r = ws.addRow([i + 1, t.equipmentId, t.equipmentName, t.category, t.employeeName, fmtFull(t.issuedAt), t.returnedAt ? fmtFull(t.returnedAt) : 'Not returned', mins === null ? 'In use' : dur(mins), t.expectedHours || '', t.conditionOut || 'GOOD', t.conditionIn || '', t.conditionNote || '', t.createdByName || '', t.returnedByName || '', t.status === 'ISSUED' ? 'ISSUED' : 'RETURNED']);
      r.height = 22; r.eachCell({ includeEmpty: true }, (c, n) => { c.border = bd; c.font = { name: 'Calibri', size: 11 }; c.alignment = { vertical: 'middle', horizontal: [1, 6, 7, 8, 9, 10, 11, 15].includes(n) ? 'center' : 'left', wrapText: n === 12 }; if (i % 2) c.fill = fill('FFF4F6F8'); });
      [10, 11].forEach(n => { const c = r.getCell(n), m = COND[c.value]; if (m) { c.fill = fill(m[0]); c.font = { name: 'Calibri', bold: true, color: { argb: m[1] } }; } });
      const sc = r.getCell(15); sc.font = { name: 'Calibri', bold: true, color: { argb: t.status === 'ISSUED' ? 'FF1D5FB4' : 'FF1B7F4B' } }; sc.fill = fill(t.status === 'ISSUED' ? 'FFDCEBFF' : 'FFDFF5E8'); if (t.status === 'ISSUED') r.getCell(7).font = { name: 'Calibri', italic: true, color: { argb: 'FF1D5FB4' } }; });
    ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4 + Math.max(rows.length, 1), column: H.length } }; };
    rows.sort((a, b) => (a.category || 'Other').localeCompare(b.category || 'Other')); addHist('All Records', rows);
    [...new Set(rows.map(t => t.category || 'Other'))].sort().forEach(c => addHist(c.replace(/[\\/?*\[\]:]/g, '').slice(0, 31), rows.filter(t => (t.category || 'Other') === c)));
    // Summary grouped by category
    const by = {}; rows.forEach(t => { const k = t.equipmentId, o = by[k] ||= { cat: t.category || 'Other', name: t.equipmentName, n: 0, ms: 0, done: 0, bad: 0 }; o.n++; if (t.returnedAt?.toMillis) { o.done++; o.ms += t.returnedAt.toMillis() - t.issuedAt.toMillis(); } if (['DAMAGED', 'FAULTY'].includes(t.conditionIn)) o.bad++; });
    const s2 = wb.addWorksheet('Summary', { views: [{ state: 'frozen', ySplit: 4 }], pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
    [18, 16, 30, 14, 18, 20].forEach((w, i) => s2.getColumn(i + 1).width = w);
    banner(s2, 6, 'SUMMARY BY CATEGORY AND EQUIPMENT', `Generated ${stamp} (SAST) · ${Object.keys(by).length} items · ${rows.filter(t => t.status === 'ISSUED').length} currently out`); s2.getRow(3).height = 8;
    head(s2, 4, ['Category', 'Equipment ID', 'Name', 'Times Issued', 'Avg Duration', 'Damaged / Faulty Returns']);
    Object.entries(by).sort((a, b) => a[1].cat.localeCompare(b[1].cat) || b[1].n - a[1].n).forEach(([k, o], i, arr) => { const r = s2.addRow([o.cat, k, o.name, o.n, o.done ? dur(o.ms / o.done) : '—', o.bad]); r.height = 22; const first = i === 0 || arr[i - 1][1].cat !== o.cat;
      r.eachCell(c => { c.border = first ? { ...bd, top: { style: 'medium', color: { argb: DARK } } } : bd; c.font = { name: 'Calibri', size: 11 }; c.alignment = { vertical: 'middle', horizontal: c.col > 3 ? 'center' : 'left' }; if (i % 2) c.fill = fill('FFF4F6F8'); }); r.getCell(1).font = { name: 'Calibri', bold: true }; if (o.bad) r.getCell(6).font = { name: 'Calibri', bold: true, color: { argb: 'FFB42318' } }; });
    const buf = await wb.xlsx.writeBuffer(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = `equipment-history-${new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date())}.xlsx`; a.click(); log('HISTORY_EXPORTED', { details: `${rows.length} records` }); toast('Excel file downloaded'); S.xo = false; render();
  } catch (e) { toast(e.message); } };

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) acts[b.dataset.act]?.(b.dataset); });
document.addEventListener('input', e => { if (e.target.id === 'sq') { S.q = e.target.value; $('#lst').innerHTML = lst(); } if (e.target.id === 'hq') { S.hq = e.target.value; $('#txl').innerHTML = txHTML(); } });
$('#out').onclick = () => signOut(auth);

// ---------- session & render ----------
function render() { const u = S.user; $('#out').hidden = !u; $('#cust').textContent = u ? (isPlat() ? 'PLATFORM' : S.cust?.name || '') : ''; $('#cust').hidden = !u;
  const items = !u || S.blocked || isPlat() ? [] : [['home', '⌂', 'Home'], ...(staff() ? [['scan', '◉', 'Scan']] : []), ['history', '≡', 'History'], ...(isCA() ? [['admin', '⚙', 'Admin']] : [])];
  const n = $('#nav'); n.style.display = items.length > 1 ? 'flex' : 'none'; n.innerHTML = items.map(([v, i, t]) => `<button class="${S.view === v ? 'on' : ''}" data-act="go" data-v="${v}"><b>${i}</b>${t}</button>`).join('');
  A.innerHTML = !u ? V.login() : S.blocked ? V.blocked() : (V[S.view] || V.home)(); }
const unsub = () => { S.un.forEach(f => f()); S.un = []; };
function start() { const on = (q, f) => S.un.push(onSnapshot(q, f, e => toast('Database error: ' + e.message)));
  on(col('equipment'), s => { S.eq = sorted(s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })), 'equipmentId'); if (['home', 'item'].includes(S.view) && !S.pend && !document.activeElement?.matches('input,select')) render(); });
  on(col('employees'), s => { S.emp = s.docs.map(d => ({ id: d.id, ...d.data() })); }); on(col('locations'), s => { S.loc = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  if (isCA()) on(query(collection(db, 'users'), where('customerId', '==', S.cid)), s => { S.users = s.docs.map(d => d.data()); }); loadRecent(); }
onAuthStateChanged(auth, async u => { unsub(); S.user = null; S.blocked = false; S.eq = []; S.tx = null; S.plat = null; if (!u) return render();
  let p; try { p = await getDoc(doc(db, 'users', u.uid)); } catch { p = null; }
  if (!p?.exists() || p.data().active === false) { S.err = 'This account is not set up or has been disabled. Contact your administrator.'; return signOut(auth); }
  S.user = { uid: u.uid, email: u.email, ...p.data() }; S.cid = S.user.customerId; S.view = isPlat() ? 'platform' : 'home';
  if (!isPlat()) { try { S.cust = (await getDoc(doc(db, 'customers', S.cid))).data(); } catch { S.cust = null; }
    if (!['TRIAL', 'ACTIVE'].includes(S.cust?.status)) { S.blocked = true; return render(); }
    S.sub = (await getDoc(doc(db, 'subscriptions', S.cid)).catch(() => null))?.data() || {}; start(); audit('USER_LOGIN'); } else plog('USER_LOGIN', 'DATAX', S.user.name);
  render(); });
setInterval(() => { if (S.user && S.view === 'home' && !document.activeElement?.matches('input')) render(); }, 30000);
const net = () => $('#off').hidden = navigator.onLine; addEventListener('online', net); addEventListener('offline', net); net();
render();

</script>
